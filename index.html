<script>
    const topics = [
        {
            id: 1, title: "Statistics", tag: "Foundations",
            subtitle: "What statistics is, why it matters, and the core vocabulary you'll use everywhere.",
            content: [
                { type: "text", heading: "What is statistics?", body: "Statistics is the science of collecting, organizing, analyzing, and interpreting data to make decisions under uncertainty. Almost every field — medicine, engineering, economics, sports — relies on it. Your syllabus builds from describing data all the way to testing hypotheses, so this foundation matters." },
                { type: "table", heading: "Two branches", rows: [["Descriptive", "Summarizes data you already have", "Average marks of a class"], ["Inferential", "Uses a sample to conclude about a population", "Predicting elections from a poll"]] },
                { type: "table", heading: "4 core terms — memorize these", rows: [["Population", "The entire group you want to study", "All students in India"], ["Sample", "A subset you actually measure", "500 randomly selected students"], ["Parameter", "A number describing the population (usually unknown)", "True average height of all students"], ["Statistic", "A number describing the sample", "Average height of 500 sampled"]] },
                { type: "example", text: "A factory makes 10,000 bulbs. You test 200 and find average lifespan = 1,200 hrs.\n→ Population: all 10,000 bulbs\n→ Sample: 200 tested\n→ Statistic: 1,200 hrs (from sample)\n→ Parameter: true average of all 10,000 (unknown)" }
            ],
            questions: [
                { difficulty: "Medium", q: "A researcher surveys 500 teenagers from 5 cities to estimate average screen time in India. (a) What is the population? (b) What is the sample? (c) She finds mean = 4.2 hrs/day — is this a parameter or statistic?", a: "(a) All teenagers in India. (b) The 500 surveyed teenagers. (c) It's a statistic — it describes the sample, not the entire population. The parameter would be the true mean screen time of ALL Indian teenagers (unknown)." },
                { difficulty: "Hard", q: "A hospital claims ER waiting time is 25 min. An auditor records 60 patients and gets mean = 32 min. (a) Identify the parameter and statistic. (b) Why might they differ? (c) Can we conclude the hospital's claim is wrong? Why or why not?", a: "(a) Parameter: true mean waiting time for all patients (the hospital's claimed 25 min). Statistic: 32 min from the 60-patient sample. (b) They differ due to sampling variability — a sample of 60 may not perfectly represent all patients, and there could be day-specific factors. (c) Not necessarily. The difference could be due to random chance. We'd need a formal hypothesis test (covered in Topic 27) to decide if 32 min is significantly different from 25 min." },
                { difficulty: "Hard", q: "A shipment has 50,000 chips. You inspect 400 and find 18 defective. (a) Define population proportion p and sample proportion p̂. (b) Calculate p̂. (c) If someone inspects a different random 400 chips, will they get the same p̂?", a: "(a) p = true proportion of defective chips among all 50,000 (unknown). p̂ = proportion in the sample = defective/total inspected. (b) p̂ = 18/400 = 0.045, or 4.5%. (c) No — a different random sample will likely give a slightly different p̂. This is called sampling variability. p̂ is a random variable that varies from sample to sample; p is fixed but unknown." }
            ]
        },
        {
            id: 2, title: "Types of Data", tag: "Foundations",
            subtitle: "Not all data is the same. Knowing what type you have determines every analysis you can do.",
            content: [
                { type: "text", heading: "Why types matter", body: "The type of data you have determines which statistics to compute, which charts to draw, and which tests to run. Using the wrong method for your data type is one of the most common statistical errors." },
                { type: "table", heading: "Data types hierarchy", rows: [["Nominal", "Categories, no order", "Blood type: A, B, AB, O"], ["Ordinal", "Categories with order, gaps unequal", "Ratings: Poor < Average < Good"], ["Interval", "Equal gaps, no true zero", "Temperature in °C (0°C ≠ no heat)"], ["Ratio", "Equal gaps + true zero", "Height, weight, salary"]] },
                { type: "table", heading: "Quantitative vs Categorical", rows: [["Quantitative (Numerical)", "Measurable numbers", "Age, salary, test score"], ["Categorical", "Groups/labels", "Gender, city, product category"], ["Discrete", "Countable whole numbers", "No. of children: 0,1,2,3"], ["Continuous", "Any value in a range", "Height: 170.35 cm"]] },
                { type: "example", text: "Quick test — is it interval or ratio?\nAsk: 'Does zero mean NONE of the thing?'\n→ 0°C doesn't mean no temperature → Interval\n→ 0 kg means no weight → Ratio\n→ 0 on IQ scale doesn't mean no intelligence → Interval" }
            ],
            questions: [
                { difficulty: "Medium", q: "Classify each variable: (a) Number of goals scored in a match (b) Customer satisfaction: 1-5 stars (c) Temperature in Kelvin (d) ZIP/PIN code (e) Time to complete a race", a: "(a) Discrete quantitative — whole number counts. (b) Ordinal — ordered categories but the gap between 1→2 stars may not equal 3→4 stars. (c) Ratio — Kelvin has a true zero (0K = no molecular motion). (d) Nominal — the numbers are just labels, arithmetic is meaningless. (e) Continuous ratio — time has a true zero and any value is possible." },
                { difficulty: "Hard", q: "A dataset has: Age (years), Income (₹), Education level (High School/Bachelor's/Master's/PhD), City, Monthly expenses (₹), Customer ID. (a) Classify all 6 variables. (b) Which variables can you calculate a mean for? (c) For which would median be better than mean and why?", a: "(a) Age: continuous ratio. Income: continuous ratio. Education: ordinal. City: nominal. Monthly expenses: continuous ratio. Customer ID: nominal (labels only). (b) Mean is mathematically valid for Age, Income, Monthly expenses (ratio/interval). Not for ordinal or nominal. (c) Median is better for Income and Monthly expenses — these are often right-skewed (a few very high earners drag the mean up). Median represents the 'typical' person better." }
            ]
        },
        {
            id: 3, title: "Mean, Mode, Median", tag: "Descriptive Stats",
            subtitle: "Measures of central tendency — three different ways to find the 'center' of your data.",
            content: [
                { type: "text", heading: "Why three measures?", body: "Each measure captures a different kind of 'center'. The best choice depends on your data type and distribution shape. A single number summarizing a dataset can be misleading if you pick the wrong one." },
                { type: "formula", text: "Mean (x̄) = Σxᵢ / n\nMedian = middle value (odd n) or average of two middle values (even n)\nMode = most frequently occurring value" },
                { type: "table", heading: "When to use which", rows: [["Mean", "Symmetric data, no outliers", "Average salary in a small team"], ["Median", "Skewed data or outliers present", "Household income of a country"], ["Mode", "Categorical data or finding most common", "Most popular shoe size"]] },
                { type: "example", text: "Data: [2, 3, 3, 5, 7, 10, 100]\nMean = (2+3+3+5+7+10+100)/7 = 130/7 ≈ 18.6\nMedian = 5 (middle value)\nMode = 3\n\nThe outlier 100 pulls the mean to 18.6 — not representative!\nMedian = 5 is much more 'typical' here." },
                { type: "text", heading: "Weighted mean", body: "When values have different importance: x̄_w = Σ(wᵢxᵢ) / Σwᵢ. Example: if your exam is worth 60% and assignment 40%, your weighted average matters more than a simple mean of both scores." }
            ],
            questions: [
                { difficulty: "Medium", q: "Salaries in a startup (₹ lakhs): [4, 5, 5, 6, 6, 6, 7, 8, 50]. (a) Calculate mean, median, mode. (b) Which best represents a 'typical' employee's salary? (c) The CEO wants to advertise 'average salary = ₹X lakhs' to attract talent. Which measure would they likely choose and is this misleading?", a: "(a) Mean = (4+5+5+6+6+6+7+8+50)/9 = 97/9 ≈ 10.8 lakhs. Median = 6 lakhs (5th value). Mode = 6 lakhs. (b) Median (or mode) = 6 lakhs — the outlier 50 (CEO salary) distorts the mean heavily. (c) The CEO would choose the mean (₹10.8 lakhs) — it sounds higher. Yes, it's misleading — 8 out of 9 employees earn less than the mean." },
                { difficulty: "Hard", q: "In a class of 30, the mean score is 72. Later it's found that one student's score was misrecorded as 85 instead of 58. (a) What is the corrected mean? (b) If the median was 70 before correction and the misrecorded student was ranked 20th out of 30 — does the median change? Explain.", a: "(a) Original total = 72 × 30 = 2160. Correction: remove 85, add 58, difference = -27. New total = 2160 - 27 = 2133. New mean = 2133/30 = 71.1. (b) The median is the average of the 15th and 16th values. The misrecorded student was ranked 20th — changing their score from 85 to 58 reorders them lower (they move below rank 15-16). The median values (15th and 16th) may shift slightly depending on surrounding values, but the change is not necessarily dramatic. Key insight: the median is resistant to changes far from the center." }
            ]
        },
        {
            id: 4, title: "Variability — Range & MAD", tag: "Descriptive Stats",
            subtitle: "Measures of spread — how much does the data vary around its center?",
            content: [
                { type: "text", heading: "Why spread matters", body: "Two datasets can have the same mean but very different spreads. Knowing variability is critical for understanding risk, consistency, and reliability. A class with mean 70 where all scores are between 68-72 is very different from one where scores range from 20 to 100." },
                { type: "formula", text: "Range = Max − Min\n\nMAD (Mean Absolute Deviation) = Σ|xᵢ − x̄| / n" },
                { type: "example", text: "Dataset A: [48, 49, 50, 51, 52] → Mean=50, Range=4, MAD=1.2\nDataset B: [10, 30, 50, 70, 90] → Mean=50, Range=80, MAD=24\n\nSame mean, wildly different spread!\nMAD tells you: on average, each point is 1.2 units away from the mean in A, and 24 units away in B." },
                { type: "table", heading: "Limitations", rows: [["Range", "Only uses 2 values (max, min). One outlier wrecks it.", "[1,2,3,4,100] → Range=99, misleading"], ["MAD", "Uses all values. Intuitive. But the absolute value makes it hard to work with algebraically.", "Less common in formal statistics"]] }
            ],
            questions: [
                { difficulty: "Medium", q: "Exam scores: [55, 60, 62, 65, 68, 70, 72, 75, 78, 95]. (a) Calculate Range and MAD. (b) Remove the outlier 95. How do Range and MAD change? (c) Which measure is more affected by the outlier?", a: "(a) Range = 95-55 = 40. Mean = (55+60+62+65+68+70+72+75+78+95)/10 = 700/10 = 70. MAD = (|55-70|+|60-70|+|62-70|+|65-70|+|68-70|+|70-70|+|72-70|+|75-70|+|78-70|+|95-70|)/10 = (15+10+8+5+2+0+2+5+8+25)/10 = 80/10 = 8. (b) Without 95: Range = 78-55 = 23. New mean = 605/9 ≈ 67.2. New MAD ≈ (12.2+7.2+5.2+2.2+0.8+2.8+4.8+7.8+10.8)/9 = 53.8/9 ≈ 6.0. (c) Range changes drastically (40→23, a 42% drop). MAD changes moderately (8→6, a 25% drop). Range is more sensitive to outliers." },
                { difficulty: "Hard", q: "Two call centers each handle 5 calls/day. Center A times (min): [8,9,10,11,12]. Center B: [4,7,10,13,16]. (a) Compare their means, ranges, and MADs. (b) A client values consistency. Which center would you recommend and why? (c) Center B claims 'our average call time is the same as A's — we're equally good.' What's wrong with this argument?", a: "(a) Both have Mean = 10 min. Center A: Range=4, MAD=1.2. Center B: Range=12, MAD=3.6. (b) Center A — despite identical means, its spread is 3x lower. Consistency means predictable service times, which clients value for planning. (c) The mean alone doesn't capture performance quality. Center B has much higher variability — sometimes calls take only 4 min (possibly rushed/incomplete) and sometimes 16 min (inefficient). Equal means ≠ equal quality; spread matters enormously in service contexts." }
            ]
        },
        {
            id: 5, title: "Std Deviation & Variance", tag: "Descriptive Stats",
            subtitle: "The most important measures of spread in all of statistics.",
            content: [
                { type: "text", heading: "Why not just use MAD?", body: "Variance and standard deviation use squared deviations instead of absolute values. This makes them mathematically elegant — they're differentiable, work beautifully with normal distributions, and form the foundation of almost every statistical test on your syllabus." },
                { type: "formula", text: "Population Variance: σ² = Σ(xᵢ − μ)² / N\nSample Variance:   s² = Σ(xᵢ − x̄)² / (n−1)\n\nStd Deviation: σ = √σ²  or  s = √s²\n\n(We divide by n-1 for samples — 'Bessel's correction')" },
                { type: "example", text: "Data: [2, 4, 4, 4, 5, 5, 7, 9]  →  Mean = 5\nDeviations: [-3,-1,-1,-1,0,0,2,4]\nSquared:    [9, 1, 1, 1, 0, 0, 4,16] → Sum = 32\nVariance (population) = 32/8 = 4\nStd Dev = √4 = 2\n\nInterpretation: on average, values are ~2 units from the mean." },
                { type: "text", heading: "Why n-1 for samples?", body: "Dividing by n underestimates the true population variance. Using n-1 corrects this bias — the sample mean 'uses up' one degree of freedom, so we only have n-1 independent pieces of information about spread." }
            ],
            questions: [
                { difficulty: "Medium", q: "Two factories produce bolts. Factory A diameters (mm): [9.8, 9.9, 10.0, 10.1, 10.2]. Factory B: [9.0, 9.5, 10.0, 10.5, 11.0]. Calculate sample variance and std deviation for both. Which factory has better quality control?", a: "Factory A: Mean=10. Deviations: [-0.2,-0.1,0,0.1,0.2]. Squared: [0.04,0.01,0,0.01,0.04]. Sum=0.1. s²=0.1/4=0.025. s=0.158mm. Factory B: Mean=10. Deviations: [-1,-0.5,0,0.5,1]. Squared: [1,0.25,0,0.25,1]. Sum=2.5. s²=2.5/4=0.625. s=0.790mm. Factory A has much better quality control — std dev is 5x smaller, meaning far more consistent bolt sizes." },
                { difficulty: "Hard", q: "A dataset of n=10 has mean=20 and variance=25. (a) A constant 5 is added to every value. What are the new mean and variance? (b) Every value is multiplied by 3. What are the new mean and variance? (c) Explain algebraically why variance doesn't change when a constant is added.", a: "(a) Adding 5: New mean = 20+5 = 25. Variance is unchanged = 25. (Adding a constant shifts all values equally, so deviations from mean stay identical.) (b) Multiplying by 3: New mean = 20×3 = 60. New variance = 25×3² = 25×9 = 225. New std dev = 15 (original 5, times 3). (c) Algebraically: new variance = Σ(xᵢ+c − (x̄+c))²/n = Σ(xᵢ − x̄)²/n = original variance. The constant c cancels out." }

                { type: "example", text: "Memory trick for skew direction:\n'Skewness follows the tail, not the hump'\n→ Right skew = tail pulls right = high outliers\n→ Left skew = tail pulls left = low outliers\n\nEffect on mean: outliers pull the mean toward the tail.\nSo: right-skewed → mean > median\n    left-skewed  → mean < median" },
                { type: "formula", text: "Pearson's Skewness Coefficient:\nSk = 3(Mean − Median) / Std Dev\n\n> 0: right-skewed\n< 0: left-skewed\n= 0: symmetric" }

                { difficulty: "Medium", q: "For a dataset: Mean=75, Median=80, Mode=85. (a) Is it left or right skewed? (b) Draw a rough description of its shape. (c) Calculate Pearson's skewness if Std Dev = 15.", a: "(a) Left-skewed (negative skew). Mean < Median < Mode — the tail extends to the left. (b) The hump (peak) is to the right, with a long tail stretching leftward. Most values are high, but some very low values drag the mean down. (c) Sk = 3(75-80)/15 = 3(-5)/15 = -15/15 = -1. Negative confirms left skew." },
                { difficulty: "Hard", q: "A teacher says: 'Most of my students scored above the class average.' Is this possible? Under what distribution shape does this happen, and give a numerical example.", a: "Yes, absolutely possible — this happens with right-skewed (positively skewed) distributions. If a few students score very high, they pull the mean up above where most students actually scored. Example: scores = [40, 45, 50, 52, 55, 58, 60, 62, 65, 95, 98]. Mean ≈ 62.7. But 8 out of 11 students scored below 62.7 (i.e., below the mean). The two high scorers (95, 98) drag the mean up, making it true that 'most students scored below average.' This is why median is often a better representation of central tendency for skewed data." }
            ]

            content: [
                { type: "text", heading: "What is an outlier?", body: "An outlier is a data point that lies far from the bulk of the data. Outliers can be: genuine extreme values (a billionaire in an income survey), data entry errors, or measurement errors. The key question is always: is this outlier real or a mistake?" },
                { type: "formula", text: "IQR Method (most common):\nIQR = Q3 − Q1\nLower fence = Q1 − 1.5 × IQR\nUpper fence = Q3 + 1.5 × IQR\nAny value outside these fences = outlier\n\nZ-score Method:\nz = (x − mean) / std dev\n|z| > 3 → outlier (in normal distributions)" },

                { type: "table", heading: "What to do with outliers", rows: [["Investigate first", "Is it a real value or an error?", "Check data collection"], ["Keep it", "If genuine, it's real information", "Billionaire in income data"], ["Remove it", "If it's a clear error", "Typo: 1700 instead of 170"], ["Use robust methods", "Median, IQR instead of mean, std dev", "When outliers can't be removed"]] }

                { difficulty: "Hard", q: "You're analyzing house prices (₹ lakhs) in a neighborhood: [45,48,50,52,55,58,60,62,65,68,500]. (a) Identify outlier(s) using IQR method. (b) Compare mean and median with and without the outlier. (c) A real estate agent wants to convince buyers the area is 'affordable' and another wants to convince sellers homes are 'valuable'. Which measure would each choose?", a: "(a) Q1=50, Q3=65, IQR=15. Upper fence=65+22.5=87.5. 500 is an outlier. (b) With outlier: Mean=(45+48+50+52+55+58+60+62+65+68+500)/11=1063/11≈96.6. Without: Mean=(45+48+50+52+55+58+60+62+65+68)/10=563/10=56.3. Median with outlier=58 (6th value). Median without=56.5. The mean changes dramatically; median barely changes. (c) Buyer's agent: use median (₹58L) — sounds affordable. Seller's agent: use mean with outlier (₹96.6L) — sounds 'premium neighborhood'. Both are technically correct but selective — this is why understanding statistics protects you from manipulation." }

                { type: "formula", text: "Percentile rank of value x:\nPR = (number of values below x / n) × 100\n\nValue at Pth percentile:\nL = (P/100) × n  →  round up to get position" },

                { type: "text", heading: "5-Number Summary", body: "The 5-number summary captures the full shape of your data: Minimum, Q1, Median (Q2), Q3, Maximum. This is what a box plot visualizes. The IQR (Q3-Q1) is the 'middle 50%' of your data." }

                { difficulty: "Hard", q: "In a standardized exam, you score 720 and are told you are at the 85th percentile. (a) What does this mean? (b) If 50,000 students took the exam, roughly how many scored above you? (c) The pass mark is the 40th percentile. The mean score is 650 and std dev is 80. If distribution is normal, what approximate score is the pass mark? (Use: 40th percentile ≈ mean - 0.25×std dev)", a: "(a) You scored better than 85% of all test-takers. (b) 15% scored above you: 0.15 × 50,000 = 7,500 students. (c) Pass mark ≈ 650 - 0.25×80 = 650 - 20 = 630. So you need roughly 630 to pass. (Note: exact z-value for 40th percentile is -0.253, so 650 - 0.253×80 ≈ 630 — same answer.)" }

        {
            id: 9, title: "Kurtosis & Skewness", tag: "Descriptive Stats",
            subtitle: "Skewness measures asymmetry; kurtosis measures tail heaviness. Together they describe the full shape of a distribution.",
            content: [
                { type: "text", heading: "Skewness (revisited formally)", body: "Skewness measures the asymmetry of a distribution. Positive skew = right tail is longer. Negative skew = left tail is longer. A perfectly symmetric distribution has skewness = 0." },
                { type: "formula", text: "Skewness = [n/((n-1)(n-2))] × Σ((xᵢ-x̄)/s)³\n\nKurtosis = [n(n+1)/((n-1)(n-2)(n-3))] × Σ((xᵢ-x̄)/s)⁴\n          − 3(n-1)²/((n-2)(n-3))\n\nExcess Kurtosis (relative to normal distribution):\n= Kurtosis − 3" },
                { type: "table", heading: "Kurtosis types", rows: [["Mesokurtic", "Excess kurtosis = 0", "Normal distribution — moderate tails"], ["Leptokurtic", "Excess kurtosis > 0", "Heavy tails, sharp peak — more outliers"], ["Platykurtic", "Excess kurtosis < 0", "Thin tails, flat peak — fewer outliers"]] },
                { type: "example", text: "Real-world kurtosis:\n→ Stock returns: Leptokurtic (fat tails = market crashes happen more than normal distribution predicts)\n→ Uniform distribution: Platykurtic\n→ Normal distribution: Mesokurtic (reference point)\n\nHigh kurtosis = RISK in finance. This is why assuming normality can be dangerous." }
            ],
            questions: [
                { difficulty: "Medium", q: "Distribution A has skewness = +2.5, kurtosis = 4. Distribution B has skewness = -0.1, kurtosis = 7. (a) Describe the shape of each. (b) Which has heavier tails? (c) A risk analyst is modeling rare extreme events. Which distribution better captures reality — high or low kurtosis? Why?", a: "(a) A: Strongly right-skewed (long right tail), leptokurtic (heavier tails than normal). B: Nearly symmetric (slight left skew), very leptokurtic (very heavy tails, sharp peak). (b) B has heavier tails (kurtosis=7 vs 4). (c) High kurtosis — heavy-tailed distributions assign more probability to extreme events. In risk analysis (financial crises, insurance claims), assuming normal distribution underestimates tail risk. Leptokurtic models better capture 'black swan' events." },
                { difficulty: "Hard", q: "You're told a dataset has: mean=median=mode, skewness=0, but excess kurtosis=+3. (a) Is this distribution normal? Why/why not? (b) What does this shape look like compared to normal? (c) In what real-world domain would this shape be dangerous to ignore?", a: "(a) Not normal. The normal distribution has skewness=0 AND excess kurtosis=0. This distribution is symmetric (like normal) but has excess kurtosis=+3, meaning it's leptokurtic. (b) It has a taller, sharper peak in the center AND heavier tails than a normal curve. It looks like a 'stretched' normal — more values near the mean AND more extreme outliers. (c) Finance/insurance: if you model returns as normal but the true distribution is leptokurtic, you'll drastically underestimate the probability of crashes, extreme losses, or catastrophic events. The 2008 financial crisis partly happened because models assumed normality when returns had fat tails." }
            ]
        },
        {
            id: 10, title: "Charts & Visualizations", tag: "Descriptive Stats",
            subtitle: "The right chart for the right data. Visualization is the fastest way to understand a dataset.",
            content: [
                { type: "table", heading: "Chart types and when to use them", rows: [["Histogram", "Distribution of one continuous variable", "Age distribution of customers"], ["Box Plot", "Distribution + outliers, good for comparison", "Salary by department"], ["Bar Chart", "Categorical comparisons", "Sales by product category"], ["Pie Chart", "Part-to-whole (use sparingly, max 5 slices)", "Market share %"], ["Scatter Plot", "Relationship between 2 variables", "Height vs weight"], ["Line Chart", "Trends over time", "Stock price over months"], ["QQ Plot", "Check if data is normally distributed", "Used in Topic 23"]] },
                { type: "example", text: "Box Plot anatomy:\n[min]---[Q1====median====Q3]---[max]\n         whisker  box  whisker\n× = outliers (beyond 1.5×IQR)\n\nThe box holds the middle 50% of data (IQR).\nLonger whisker on right = right skew.\nLonger whisker on left = left skew." },
                { type: "text", heading: "Common mistakes", body: "1. Using pie charts with too many categories (use bar chart instead). 2. Starting y-axis not at zero in bar charts (makes differences look larger). 3. Using line charts for categorical data. 4. Not labeling axes. 5. Confusing histogram (continuous) with bar chart (categorical)." }

            questions: [
                { difficulty: "Medium", q: "For each dataset, name the best chart and explain why: (a) Monthly revenue for 2024 (b) Distribution of exam scores (c) Proportion of users on iOS vs Android vs Windows (d) Relationship between ad spend and sales (e) Comparing delivery times across 5 cities.", a: "(a) Line chart — shows trend and change over time clearly. (b) Histogram — shows shape, spread, center of a continuous distribution. (c) Bar chart (not pie — 3 categories is okay for pie, but bar is more accurate for reading exact values). (d) Scatter plot — shows relationship/correlation between two continuous variables. (e) Box plots (one per city) — compares distributions including median, spread, and outliers simultaneously." },
                { difficulty: "Hard", q: "A box plot shows: Min=10, Q1=30, Median=45, Q3=70, Max=200. Whiskers extend to 10 and 120. (a) Why doesn't the whisker reach 200? (b) Calculate IQR and the outlier threshold. (c) How many outliers are there at minimum, and where? (d) Based on the box plot, is the data skewed? In which direction?", a: "(a) The upper whisker extends to the last non-outlier value (120), not the maximum. Values beyond the fence (Q3+1.5×IQR) are plotted as individual outlier points. (b) IQR=Q3-Q1=70-30=40. Upper fence=70+60=130. Lower fence=30-60=-30. (c) At least one outlier: the value 200 (>130). We don't know if there are more between 120 and 200. (d) Right-skewed: the right whisker (120-70=50) is longer than the left (30-10=20), the median (45) is closer to Q1 than Q3, and there's an outlier on the right side." }

        {
            id: 11, title: "Random Variables", tag: "Probability",
            subtitle: "The bridge between probability and statistics. A random variable assigns numbers to outcomes of random experiments.",
            content: [
                { type: "text", heading: "What is a random variable?", body: "A random variable (RV) is a function that maps each outcome of a random experiment to a real number. It's called 'random' because its value depends on the outcome of a chance event." },
                { type: "example", text: "Experiment: Flip 2 coins. Outcomes: HH, HT, TH, TT\nLet X = number of heads.\nX(HH)=2, X(HT)=1, X(TH)=1, X(TT)=0\n→ X can take values {0, 1, 2}. X is a random variable." },
                { type: "table", heading: "Types of random variables", rows: [["Discrete RV", "Takes countable values (integers)", "Number of goals, defective items, dice rolls"], ["Continuous RV", "Takes any value in an interval (uncountable)", "Height, weight, time, temperature"]] },
                { type: "text", heading: "Notation", body: "X, Y, Z typically denote random variables. P(X=x) means the probability that the RV X takes the specific value x. For continuous RVs, we talk about P(a < X < b) since P(X = exact value) = 0." }

            questions: [
                { difficulty: "Medium", q: "A fair die is rolled twice. Let X = sum of both rolls. (a) What are the possible values of X? (b) Is X discrete or continuous? (c) Calculate P(X=7) and P(X≥11).", a: "(a) X can be 2,3,4,...,12 (11 possible values). (b) Discrete — only integer values. (c) P(X=7): pairs summing to 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) = 6 outcomes. P(X=7)=6/36=1/6≈0.167. P(X≥11): X=11: (5,6),(6,5)=2 outcomes. X=12: (6,6)=1 outcome. P(X≥11)=3/36=1/12≈0.083." },
                { difficulty: "Hard", q: "X = lifetime (years) of a machine (continuous RV). P(X>5)=0.6, P(X>8)=0.3. (a) What is P(5<X≤8)? (b) P(X≤5)? (c) If 10 such machines are used independently, what's the probability all 10 last more than 5 years? (d) What assumption did you use in (c)?", a: "(a) P(5<X≤8)=P(X>5)-P(X>8)=0.6-0.3=0.3. (b) P(X≤5)=1-P(X>5)=1-0.6=0.4. (c) P(all 10 last >5 years)=(0.6)^10≈0.006 or 0.6%. Very small — even though each machine has 60% chance, the joint probability is tiny. (d) Independence — the machines must fail independently. If they're in the same environment (same heat, vibration), failures may be correlated, making this calculation wrong." }
            ]

        {
            id: 12, title: "Formation of Events", tag: "Probability",
            subtitle: "Sample spaces, events, and how to compute probabilities using set theory.",
            content: [
                { type: "table", heading: "Core definitions", rows: [["Sample space (S)", "Set of all possible outcomes", "S = {H, T} for a coin flip"], ["Event (E)", "A subset of the sample space", "E = {H} = event of getting heads"], ["Complement (Eᶜ)", "All outcomes NOT in E", "Eᶜ = {T}"], ["Union (A∪B)", "Outcomes in A OR B or both", "At least one event occurs"], ["Intersection (A∩B)", "Outcomes in both A AND B", "Both events occur"]] },
                { type: "formula", text: "P(A∪B) = P(A) + P(B) − P(A∩B)  [Addition Rule]\nP(Aᶜ) = 1 − P(A)              [Complement Rule]\nP(A|B) = P(A∩B) / P(B)        [Conditional Probability]\nP(A∩B) = P(A)×P(B)            [Only if A,B independent]" },
                { type: "example", text: "Draw a card from 52-card deck.\nA = 'card is red', B = 'card is a king'\nP(A) = 26/52 = 0.5\nP(B) = 4/52 ≈ 0.077\nP(A∩B) = 2/52 (red kings)\nP(A∪B) = 0.5 + 0.077 - 2/52 = 28/52 ≈ 0.538" }
            ],
            questions: [
                { difficulty: "Medium", q: "In a group of 100 students: 60 study Maths, 45 study Science, 25 study both. A student is picked randomly. Find: (a) P(Maths or Science) (b) P(only Maths) (c) P(neither) (d) P(Maths | Science)", a: "(a) P(M∪S)=P(M)+P(S)-P(M∩S)=60/100+45/100-25/100=80/100=0.8. (b) P(only Maths)=P(M)-P(M∩S)=60/100-25/100=35/100=0.35. (c) P(neither)=1-P(M∪S)=1-0.8=0.2. (d) P(M|S)=P(M∩S)/P(S)=(25/100)/(45/100)=25/45=5/9≈0.556." },
                { difficulty: "Hard", q: "P(A)=0.4, P(B)=0.5, P(A|B)=0.3. (a) Find P(A∩B). (b) Find P(A∪B). (c) Are A and B independent? (d) Find P(B|A).", a: "(a) P(A∩B)=P(A|B)×P(B)=0.3×0.5=0.15. (b) P(A∪B)=0.4+0.5-0.15=0.75. (c) If independent: P(A∩B)=P(A)×P(B)=0.4×0.5=0.2≠0.15. They're NOT independent. (d) P(B|A)=P(A∩B)/P(A)=0.15/0.4=0.375." }
            ]
        },
        {
            id: 13, title: "PMF, CDF, PDF", tag: "Probability",
            subtitle: "The mathematical tools that describe how probability is distributed across values of a random variable.",
            content: [
                { type: "table", heading: "Three functions", rows: [["PMF (Probability Mass Function)", "Discrete RVs", "P(X=x) for each value x. Must sum to 1."], ["CDF (Cumulative Distribution Function)", "Both types", "F(x) = P(X ≤ x). Always non-decreasing, 0→1."], ["PDF (Probability Density Function)", "Continuous RVs", "f(x) ≥ 0 and area under curve = 1. P(a<X<b)=∫f(x)dx"]] },
                { type: "formula", text: "PMF: Σ P(X=xᵢ) = 1, each P(X=x) ≥ 0\nCDF: F(x) = P(X ≤ x) = Σ P(X=k) for k≤x\n\nPDF: ∫₋∞^∞ f(x)dx = 1, f(x) ≥ 0\nP(a<X<b) = ∫ₐᵇ f(x)dx\nCDF: F(x) = ∫₋∞^x f(t)dt" },
                { type: "example", text: "Discrete: Roll a die. X = outcome.\nPMF: P(X=k) = 1/6 for k=1,2,...,6\nCDF: F(3) = P(X≤3) = 3/6 = 0.5\n\nContinuous: X ~ Uniform[0,2]\nPDF: f(x) = 1/2 for 0≤x≤2, else 0\nCDF: F(x) = x/2 for 0≤x≤2\nP(0.5<X<1.5) = ∫f(x)dx = (1.5-0.5)/2 = 0.5" }
            ],
            questions: [
                { difficulty: "Medium", q: "X has PMF: P(X=1)=0.1, P(X=2)=0.3, P(X=3)=0.4, P(X=4)=k. (a) Find k. (b) Build the CDF table. (c) Find P(2≤X≤4). (d) P(X>2).", a: "(a) Sum=1: 0.1+0.3+0.4+k=1 → k=0.2. (b) F(1)=0.1, F(2)=0.4, F(3)=0.8, F(4)=1.0. (c) P(2≤X≤4)=F(4)-F(1)=1-0.1=0.9. (d) P(X>2)=1-F(2)=1-0.4=0.6." },
                { difficulty: "Hard", q: "Continuous RV X has PDF f(x)=cx² for 0≤x≤2, else 0. (a) Find c. (b) Find the CDF F(x). (c) Find P(1<X<1.5). (d) Find the median.", a: "(a) ∫₀²cx²dx=1 → c[x³/3]₀²=1 → c(8/3)=1 → c=3/8. (b) F(x)=∫₀ˣ(3/8)t²dt=(3/8)(x³/3)=x³/8 for 0≤x≤2. (c) P(1<X<1.5)=F(1.5)-F(1)=(1.5)³/8-1³/8=3.375/8-1/8=2.375/8≈0.297. (d) Median m: F(m)=0.5 → m³/8=0.5 → m³=4 → m=4^(1/3)≈1.587." }
            ]
        },
        {
            id: 14, title: "Expectation of RV", tag: "Probability",
            subtitle: "The expected value is the long-run average of a random variable — the 'center of gravity' of a distribution.",
            content: [
                { type: "formula", text: "Discrete:   E[X] = Σ xᵢ · P(X=xᵢ)\nContinuous: E[X] = ∫ x · f(x) dx\n\nE[g(X)] = Σ g(xᵢ) · P(X=xᵢ)  [Function of RV]" },
                { type: "example", text: "Lottery: Win ₹1000 with P=0.01, ₹0 otherwise. Ticket costs ₹20.\nX = net gain. E[X] = 1000×0.01 + 0×0.99 - 20 = 10 - 20 = -₹10\n→ On average, you LOSE ₹10 per ticket.\n→ Lotteries are designed so E[X] < 0 for players." },
                { type: "text", heading: "Intuition", body: "E[X] is NOT the most likely outcome — it's the average if you repeated the experiment infinitely many times. A fair die has E[X]=3.5, but 3.5 is never an actual outcome. Think of it as the 'balance point' of the probability distribution." }
            ],
            questions: [
                { difficulty: "Medium", q: "Insurance: An insurer charges ₹5000 premium. P(claim ₹100,000)=0.02, P(claim ₹50,000)=0.05, P(no claim)=0.93. (a) Find expected payout. (b) Expected profit per policy. (c) Is the insurer making or losing money on average?", a: "(a) E[payout]=100000×0.02+50000×0.05+0×0.93=2000+2500+0=₹4500. (b) E[profit]=5000-4500=₹500 per policy. (c) Making money — expected profit of ₹500/policy. Over 10,000 policies: expected profit = ₹50,00,000. This is how insurance works — collecting small sure amounts (premiums) to cover uncertain large payouts." },
                { difficulty: "Hard", q: "X has PDF f(x)=2x for 0≤x≤1, else 0. (a) Verify it's a valid PDF. (b) Find E[X]. (c) Find E[X²]. (d) Hence find Var(X) using Var(X)=E[X²]-(E[X])².", a: "(a) ∫₀¹2x dx=[x²]₀¹=1 ✓ and f(x)≥0 ✓. (b) E[X]=∫₀¹x·2x dx=∫₀¹2x²dx=2[x³/3]₀¹=2/3≈0.667. (c) E[X²]=∫₀¹x²·2x dx=∫₀¹2x³dx=2[x⁴/4]₀¹=1/2=0.5. (d) Var(X)=E[X²]-(E[X])²=0.5-(2/3)²=0.5-4/9=9/18-8/18=1/18≈0.056." }
            ]
        },
        {
            id: 15, title: "Properties of Expectation", tag: "Probability",
            subtitle: "Linearity of expectation is one of the most powerful tools in probability — it makes complex calculations simple.",
            content: [
                { type: "formula", text: "E[c] = c                      (constant)\nE[cX] = c·E[X]               (scaling)\nE[X+Y] = E[X] + E[Y]         (ALWAYS true)\nE[X+c] = E[X] + c            (shift)\nE[XY] = E[X]·E[Y]            (ONLY if X,Y independent)\nE[aX+bY+c] = aE[X]+bE[Y]+c  (linearity)" },
                { type: "example", text: "X = die roll. E[X]=3.5\nE[3X+2] = 3×3.5 + 2 = 12.5\nE[X²] ≠ (E[X])² in general!\n\nIf X,Y are independent die rolls:\nE[X+Y] = 3.5+3.5 = 7 (always works)\nE[XY] = 3.5×3.5 = 12.25 (only works since independent)" },
                { type: "text", heading: "Key warning", body: "E[XY]=E[X]·E[Y] ONLY when X and Y are independent. E[X+Y]=E[X]+E[Y] is ALWAYS true regardless of dependence — this is the magic of linearity of expectation. It's why complex problems become easy: you can break sums into pieces." }
            ],
            questions: [
                { difficulty: "Medium", q: "X and Y are independent. E[X]=4, E[Y]=6, E[X²]=20, E[Y²]=45. Find: (a) E[3X-2Y+5] (b) E[XY] (c) Var(X) and Var(Y) (d) E[X²Y]", a: "(a) E[3X-2Y+5]=3×4-2×6+5=12-12+5=5. (b) E[XY]=E[X]×E[Y]=4×6=24 (independent). (c) Var(X)=E[X²]-(E[X])²=20-16=4. Var(Y)=E[Y²]-(E[Y])²=45-36=9. (d) E[X²Y]=E[X²]×E[Y]=20×6=120 (independent, so can separate)." },
                { difficulty: "Hard", q: "100 people each independently roll a die. Let S = sum of all rolls. (a) Find E[S] using linearity (explain why this approach is elegant). (b) A casino offers a game: pay ₹400 upfront, then roll 100 dice and win ₹4 per pip showing. Is this a fair game? Profitable for casino?", a: "(a) Let Xᵢ=outcome of i-th roll. E[Xᵢ]=3.5 for all i. E[S]=E[X₁+X₂+...+X₁₀₀]=E[X₁]+...+E[X₁₀₀]=100×3.5=350. Elegance: linearity works regardless of independence. We didn't need to think about 6^100 outcomes — just one die's expectation times 100. (b) E[winnings]=4×E[S]=4×350=₹1400. Net gain=1400-400=₹1000. Fair game would give E[net]=0. Here E[net]=+₹1000 for the player — this game is UNFAVORABLE for the casino. A fair game would charge ₹1400." }
            ]
        },
        {
            id: 16, title: "Variance of RV", tag: "Probability",
            subtitle: "Variance properties let you compute spread of transformed and combined random variables.",
            content: [
                { type: "formula", text: "Var(X) = E[(X-μ)²] = E[X²] - (E[X])²\n\nVar(c) = 0                     (constant has no spread)\nVar(cX) = c²·Var(X)            (scale squares the variance)\nVar(X+c) = Var(X)              (shift doesn't change spread)\n\nIf X, Y INDEPENDENT:\nVar(X+Y) = Var(X) + Var(Y)\nVar(X-Y) = Var(X) + Var(Y)    (note: + not -)\nVar(aX+bY) = a²Var(X) + b²Var(Y)" },
                { type: "example", text: "X ~ die roll: E[X]=3.5, E[X²]=91/6≈15.17\nVar(X)=15.17-3.5²=15.17-12.25=2.92\n\nIf Y = another independent die roll:\nVar(X+Y) = 2.92+2.92 = 5.83\nStd Dev(X+Y) = √5.83 ≈ 2.42" },
                { type: "text", heading: "Critical: Var(X-Y)=Var(X)+Var(Y)", body: "When subtracting two independent random variables, variances ADD (not subtract). Think about it: if X and Y both vary unpredictably, their difference X-Y also varies a lot. Subtraction doesn't reduce uncertainty — it combines it." }
            ],
            questions: [
                { difficulty: "Medium", q: "X: E[X]=10, Var(X)=4. Y: E[Y]=6, Var(Y)=9. X and Y independent. Find: (a) Var(3X) (b) Var(X-Y) (c) Var(2X+3Y-5) (d) Std Dev of (X+Y)", a: "(a) Var(3X)=9×4=36. (b) Var(X-Y)=Var(X)+Var(Y)=4+9=13. (c) Var(2X+3Y-5)=4×4+9×9+0=16+81=97. (d) Var(X+Y)=4+9=13. Std Dev=√13≈3.61." },
                { difficulty: "Hard", q: "X is the weight of a banana (grams): E[X]=150, Var(X)=25. A bunch = 6 independent bananas. (a) E and Var of total weight. (b) Std Dev of total. (c) A box contains 10 bunches. Find E and Std Dev of total box weight. (d) Why is Std Dev of 60 bananas less than 60 × Std Dev of one banana?", a: "(a) S=X₁+...+X₆. E[S]=6×150=900g. Var(S)=6×25=150. (b) Std Dev=√150≈12.25g. (c) Box = 10 bunches = 60 bananas. E[total]=60×150=9000g. Var[total]=60×25=1500. Std Dev=√1500≈38.7g. (d) 60×Std Dev(one)=60×5=300g vs actual 38.7g. The difference: individual random variations cancel out when you sum many independent variables. High values cancel low values. This is the essence of why large samples give more stable estimates — the 'diversification' effect. Std Dev grows as √n, not n." }
            ]
        },
        {
            id: 17, title: "Bernoulli Distribution", tag: "Distributions",
            subtitle: "The simplest distribution — one trial with two outcomes. The foundation of all other discrete distributions.",
            content: [
                { type: "text", heading: "What is a Bernoulli trial?", body: "A Bernoulli trial is a single experiment with exactly two outcomes: Success (1) with probability p, and Failure (0) with probability 1-p (also written q). Every yes/no, pass/fail, heads/tails situation is a Bernoulli trial." },
                { type: "formula", text: "X ~ Bernoulli(p)\nP(X=1) = p     (success)\nP(X=0) = 1-p   (failure)\n\nE[X] = p\nVar(X) = p(1-p) = pq\nStd Dev = √(pq)" },
                { type: "example", text: "Free throw basketball: p = 0.75 (makes the shot)\nX ~ Bernoulli(0.75)\nP(X=1) = 0.75, P(X=0) = 0.25\nE[X] = 0.75 (expected value = probability)\nVar(X) = 0.75×0.25 = 0.1875\n\nVariance is maximum when p=0.5 (most uncertain)\nVariance → 0 when p→0 or p→1 (outcome is predictable)" }
            ],
            questions: [
                { difficulty: "Medium", q: "A biased coin: P(heads)=0.6. X=1 if heads, 0 if tails. (a) Write the PMF. (b) Find E[X] and Var(X). (c) What does E[X]=0.6 mean intuitively? (d) For what value of p is Var(X) maximized and why?", a: "(a) P(X=1)=0.6, P(X=0)=0.4. (b) E[X]=0.6. Var(X)=0.6×0.4=0.24. (c) If you flip this coin thousands of times, about 60% will be heads. E[X]=0.6 means the average of X (treating heads=1, tails=0) converges to 0.6. (d) Var(X)=p(1-p) is maximized at p=0.5. Derivative: d/dp[p-p²]=1-2p=0 → p=0.5. Makes sense: when p=0.5 (fair coin), the outcome is most uncertain, so variance is highest." },
                { difficulty: "Hard", q: "A quality inspector checks items. Each item has P(defective)=0.05. (a) Define Bernoulli RV. (b) In terms of costs: a defective item that passes costs ₹1000 (Type II error); scrapping a good item costs ₹200 (Type I error). Write E[cost] per item. (c) If the inspector can adjust the threshold so P(defective caught)=0.9 but then P(good item scrapped)=0.15, find the new E[cost per item].", a: "(a) X=1 if item is defective (P=0.05), X=0 if good (P=0.95). (b) P(defective passes)=P(defective not caught)=0.05×(1-1)=assume 100% detection first. General: E[cost]=1000×P(defective not caught)+200×P(good scrapped). With perfect detection: E=1000×0+200×0=₹0 (theoretical). With no inspection: E=1000×0.05=₹50/item. (c) New: P(defective not caught)=0.05×0.1=0.005. P(good scrapped)=0.95×0.15=0.1425. E[cost]=1000×0.005+200×0.1425=5+28.5=₹33.5/item. Better than no inspection (₹50) but has a cost due to false alarms." }
            ]
        },
        {
            id: 18, title: "Binomial Distribution", tag: "Distributions",
            subtitle: "n independent Bernoulli trials. The most widely used discrete distribution.",
            content: [
                { type: "text", heading: "When to use Binomial", body: "Use Binomial when: (1) Fixed number of trials n. (2) Each trial is independent. (3) Only two outcomes per trial. (4) Same probability p for each trial. If all 4 hold → X ~ Binomial(n, p)." },
                { type: "formula", text: "X ~ Binomial(n, p)\nP(X=k) = C(n,k) × pᵏ × (1-p)^(n-k)\n\nwhere C(n,k) = n! / [k!(n-k)!]\n\nE[X] = np\nVar(X) = np(1-p)\nStd Dev = √(np(1-p))" },
                { type: "example", text: "10 free throws, P(make)=0.7. X = makes.\nX ~ Binomial(10, 0.7)\nE[X] = 10×0.7 = 7 (expect 7 makes)\nVar(X) = 10×0.7×0.3 = 2.1\nStd Dev ≈ 1.45\n\nP(exactly 8) = C(10,8)×0.7⁸×0.3²\n= 45×0.0576×0.09 = 0.233" }
            ],
            questions: [
                { difficulty: "Medium", q: "A MCQ test: 20 questions, 4 options each, student guesses randomly. X = correct answers. (a) Identify distribution. (b) Find E[X] and Std Dev. (c) Find P(X≥1). (d) Find P(X=5).", a: "(a) X~Binomial(20, 0.25) — 20 trials, p=1/4, independent. (b) E[X]=20×0.25=5. Var=20×0.25×0.75=3.75. Std Dev=√3.75≈1.94. (c) P(X≥1)=1-P(X=0)=1-C(20,0)×0.25⁰×0.75²⁰=1-0.75²⁰=1-0.00317≈0.9968. (d) P(X=5)=C(20,5)×0.25⁵×0.75¹⁵=15504×0.000977×0.01336≈0.202." },
                { difficulty: "Hard", q: "In a manufacturing line, 8% of products are defective. A batch of 25 is sampled. (a) Find P(exactly 3 defective). (b) P(at most 2 defective). (c) The batch is rejected if more than 3 are defective. Find P(rejection). (d) What sample size n would you need so that E[defectives] = 4?", a: "(a) X~Bin(25,0.08). P(X=3)=C(25,3)×0.08³×0.92²²=2300×0.000512×0.162≈0.191. (b) P(X≤2)=P(0)+P(1)+P(2). P(0)=0.92²⁵≈0.124. P(1)=25×0.08×0.92²⁴=25×0.08×0.135≈0.270. P(2)=C(25,2)×0.08²×0.92²³=300×0.0064×0.147≈0.282. P(X≤2)≈0.124+0.270+0.282=0.676. (c) P(rejection)=P(X>3)=1-P(X≤3)=1-(0.676+0.191)=0.133. (d) E[X]=np=4 → 0.08n=4 → n=50." }
            ]
        },
        {
            id: 19, title: "Poisson Distribution", tag: "Distributions",
            subtitle: "Models the number of events occurring in a fixed interval of time or space, when events happen independently at a constant average rate.",
            content: [
                { type: "text", heading: "When to use Poisson", body: "Use Poisson for: counting events in time/space (calls per hour, accidents per month, flaws per meter). Key conditions: events are independent, rate is constant, two events can't happen at exactly the same instant." },
                { type: "formula", text: "X ~ Poisson(λ)\nP(X=k) = (e^(-λ) × λᵏ) / k!    for k = 0,1,2,...\n\nE[X] = λ\nVar(X) = λ\nStd Dev = √λ\n\nNote: Mean = Variance = λ (unique property!)" },
                { type: "example", text: "A call center gets 3 calls/minute on average. λ=3\nP(exactly 5 calls in a minute):\n= e⁻³ × 3⁵ / 5! = 0.0498 × 243 / 120 = 0.101\n\nP(0 calls) = e⁻³ = 0.0498 ≈ 5% chance of silence\n\nPoisson as limit of Binomial: if n is large,\np is small, np=λ → Binomial ≈ Poisson(λ)" }
            ],
            questions: [
                { difficulty: "Medium", q: "Website crashes: average 2 per week. X~Poisson(2). (a) P(no crash this week). (b) P(at least 3 crashes). (c) P(exactly 1 crash). (d) E[X] and Var(X).", a: "(a) P(X=0)=e⁻²×2⁰/0!=e⁻²≈0.135. (b) P(X≥3)=1-P(X≤2)=1-[P(0)+P(1)+P(2)]. P(1)=e⁻²×2=0.271. P(2)=e⁻²×4/2=0.271. P(X≥3)=1-(0.135+0.271+0.271)=1-0.677=0.323. (c) P(X=1)≈0.271. (d) E[X]=Var(X)=λ=2." },
                { difficulty: "Hard", q: "Radioactive decay: 4 particles detected per second on average. (a) P(exactly 6 in 1 second). (b) P(more than 2 in 0.5 seconds). (c) In 10 independent seconds, what is the distribution of total particles? (d) Find P(total in 10 seconds > 50).", a: "(a) λ=4. P(X=6)=e⁻⁴×4⁶/6!=0.0183×4096/720≈0.104. (b) In 0.5 sec: λ'=4×0.5=2. P(X>2)=1-P(X≤2)=1-(e⁻²+2e⁻²+2e⁻²)=1-5e⁻²=1-5×0.135=1-0.677=0.323. (c) Sum of 10 independent Poisson(4) = Poisson(40). (Sum of independent Poissons is Poisson with summed rates.) (d) X_total~Poisson(40). E=40, Var=40, Std Dev=√40≈6.32. P(X>50): Use normal approximation (since λ=40 is large). z=(50-40)/6.32≈1.58. P(Z>1.58)≈0.057 or about 5.7%." }
            ]
        },
        {
            id: 20, title: "Uniform Distribution", tag: "Distributions",
            subtitle: "The 'equally likely' distribution — discrete or continuous. Simple but powerful.",
            content: [
                { type: "table", heading: "Discrete vs Continuous Uniform", rows: [["Discrete U{a,...,b}", "n equally likely integer outcomes", "Roll a fair die: U{1,2,3,4,5,6}"], ["Continuous U[a,b]", "Every value in [a,b] equally likely", "Bus arrives uniformly between 0-10 min"]] },
                { type: "formula", text: "Discrete Uniform U{1,...,n}:\nP(X=k) = 1/n for each k\nE[X] = (n+1)/2\nVar(X) = (n²-1)/12\n\nContinuous Uniform U[a,b]:\nf(x) = 1/(b-a) for a≤x≤b\nE[X] = (a+b)/2\nVar(X) = (b-a)²/12\nCDF: F(x) = (x-a)/(b-a)" },
                { type: "example", text: "Bus arrives uniformly between 0 and 20 minutes.\nX ~ U[0,20]\nf(x) = 1/20\nE[X] = 10 minutes (expected wait)\nVar(X) = (20)²/12 = 400/12 ≈ 33.3\nStd Dev ≈ 5.77 minutes\n\nP(wait > 15 min) = (20-15)/20 = 0.25" }
            ],
            questions: [
                { difficulty: "Medium", q: "X~U[2,10]. (a) Find PDF, E[X], Var(X). (b) P(X>7). (c) P(3<X<6). (d) Find the median.", a: "(a) f(x)=1/(10-2)=1/8. E[X]=(2+10)/2=6. Var=(10-2)²/12=64/12≈5.33. Std Dev≈2.31. (b) P(X>7)=(10-7)/(10-2)=3/8=0.375. (c) P(3<X<6)=(6-3)/8=3/8=0.375. (d) Median=E[X]=6 (uniform is symmetric, so mean=median)." },
                { difficulty: "Hard", q: "You order food online, delivery uniform between 30-60 min. You arrive home at minute 40. (a) P(food already arrived). (b) P(wait more than 10 more min). (c) Given food hasn't arrived at minute 40, find conditional distribution of arrival time. (d) Is uniform a realistic model for delivery times? What might be better?", a: "(a) P(arrived by minute 40)=P(X≤40)=(40-30)/30=10/30=1/3≈33%. (b) P(X>50)=(60-50)/30=10/30=1/3≈33%. (c) Given X>40 (hasn't arrived), X|X>40 ~ U[40,60]. The distribution 'resets' — uniform has no memory. P(arrive between 40-50 | X>40)=10/20=0.5. (d) Uniform is unrealistic — delivery times cluster around a mean, tail off at extremes, and are rarely equally likely across the range. Normal distribution truncated at lower bound, or log-normal, or exponential convolution would be more realistic. Uniform is used when we have truly no information beyond min and max." }
            ]
        },
        {
            id: 21, title: "Exponential Distribution", tag: "Distributions",
            subtitle: "Models waiting times between events. Famous for the memoryless property.",
            content: [
                { type: "formula", text: "X ~ Exponential(λ)  where λ = rate (events per unit time)\n\nPDF: f(x) = λe^(-λx)  for x≥0\nCDF: F(x) = 1 - e^(-λx)\nP(X>x) = e^(-λx)\n\nE[X] = 1/λ    (mean waiting time)\nVar(X) = 1/λ²\nStd Dev = 1/λ" },
                { type: "example", text: "Calls arrive at rate 2/hour. Wait time X~Exp(2).\nE[X] = 1/2 hour = 30 minutes\nP(wait > 1 hr) = e^(-2×1) = e⁻² ≈ 0.135\nP(wait < 0.5 hr) = 1-e^(-2×0.5) = 1-e⁻¹ ≈ 0.632" },
                { type: "text", heading: "Memoryless Property", body: "P(X > s+t | X > s) = P(X > t). The past doesn't affect the future. If you've been waiting 30 minutes, the probability of waiting another 30 minutes is the same as if you just started waiting. Like a coin flip — previous results don't influence the next. This is what makes Poisson/Exponential special (and is only true for the exponential among continuous distributions)." }
            ],
            questions: [
                { difficulty: "Medium", q: "Customer service: average wait 5 minutes. X~Exp(λ=1/5=0.2). (a) P(wait < 3 min). (b) P(wait > 8 min). (c) E[X] and Var(X). (d) P(3<X<8).", a: "(a) P(X<3)=1-e^(-0.2×3)=1-e^(-0.6)=1-0.549=0.451. (b) P(X>8)=e^(-0.2×8)=e^(-1.6)=0.202. (c) E[X]=1/0.2=5 min. Var=1/0.04=25. Std Dev=5 min. (d) P(3<X<8)=F(8)-F(3)=0.798-0.451=0.347." },
                { difficulty: "Hard", q: "ATM: breakdown rate λ=0.1 per day. (a) P(works >30 days). (b) Given it has already worked 20 days, P(works 10 more). Explain using memoryless property. (c) Compare with Binomial: if each day P(breakdown)=0.1 independently, P(no breakdown in 30 days). (d) Why do the answers differ?", a: "(a) X~Exp(0.1). P(X>30)=e^(-0.1×30)=e^(-3)≈0.050. (b) By memoryless: P(X>30|X>20)=P(X>10)=e^(-0.1×10)=e^(-1)≈0.368. The 20 days worked are irrelevant — it's as if the machine just started. (c) Binomial: P(no breakdown)=(1-0.1)^30=0.9^30≈0.042. (d) They model different things. Exponential: continuous time, constant rate. Binomial: 30 discrete trials, fixed probability per day. They give similar but not identical answers. Exponential is the continuous-time limit of Binomial as trial length→0." }
            ]
        },
        {
            id: 22, title: "Normal Distribution", tag: "Distributions",
            subtitle: "The bell curve. The most important distribution in all of statistics — appears everywhere due to the Central Limit Theorem.",
            content: [
                { type: "formula", text: "X ~ Normal(μ, σ²)\nPDF: f(x) = (1/σ√2π) × e^(-(x-μ)²/2σ²)\n\nStandard Normal: Z = (X-μ)/σ ~ N(0,1)\n\nEmpirical Rule (68-95-99.7):\n→ 68% of data within μ±1σ\n→ 95% within μ±2σ\n→ 99.7% within μ±3σ" },
                { type: "example", text: "IQ scores: X~N(100, 15²)\nP(IQ > 130) = P(Z > (130-100)/15) = P(Z>2)\n= 1 - 0.977 = 0.023 → ~2.3% have IQ>130\n\nP(85<IQ<115) = P(-1<Z<1) = 0.683 (68% rule)" },
                { type: "table", heading: "Chebyshev's Inequality (no distribution assumed)", rows: [["Works for ANY distribution", "P(|X-μ| ≥ kσ) ≤ 1/k²", "Conservative but universal"], ["k=2", "P(|X-μ| ≥ 2σ) ≤ 1/4 = 25%", "Normal gives 5%"], ["k=3", "P(|X-μ| ≥ 3σ) ≤ 1/9 ≈ 11%", "Normal gives 0.3%"]] }
            ],
            questions: [
                { difficulty: "Medium", q: "Heights X~N(170, 8²) cm. (a) P(160<X<180). (b) P(X>186). (c) What height separates top 10%?", a: "(a) P(160<X<180)=P(-1.25<Z<1.25)≈0.789. (b) P(X>186)=P(Z>(186-170)/8)=P(Z>2)=0.023. (c) Top 10%: P(Z>z)=0.10 → z=1.28. X=170+1.28×8=180.2 cm." },
                { difficulty: "Hard", q: "Monthly sales X~N(₹50L, 8²). (a) P(sales>60L). (b) Apply Chebyshev: P(sales deviates >24L from mean). (c) Compare Chebyshev bound with actual normal probability. (d) Why is Chebyshev useful even though it's weaker?", a: "(a) P(X>60)=P(Z>10/8)=P(Z>1.25)=1-0.894=0.106. (b) k=24/8=3 standard deviations. Chebyshev: P(|X-50|≥24)≤1/9≈0.111. (c) Normal: P(|X-50|≥24)=P(|Z|≥3)=0.003. Chebyshev gives ≤11.1%, actual is only 0.3% — Chebyshev is very conservative. (d) Chebyshev works for ANY distribution without knowing its shape. If you don't know if data is normal, Chebyshev gives a guaranteed bound. Normal probability assumes normality — if that assumption is wrong, your 0.3% could be wildly off. Chebyshev's 11.1% is always safe." }
            ]
        },
        {
            id: 23, title: "QQ Plot, Log-Normal, Power Law", tag: "Distributions",
            subtitle: "Tools for checking normality and modeling heavy-tailed real-world data.",
            content: [
                { type: "text", heading: "QQ Plot (Quantile-Quantile Plot)", body: "A QQ plot plots the quantiles of your data against quantiles of a theoretical distribution (usually normal). If points fall on a straight line → data matches that distribution. Deviations from the line reveal skew, heavy tails, or other non-normality." },
                { type: "table", heading: "QQ plot patterns", rows: [["Straight line", "Data matches theoretical distribution", ""], ["S-curve", "Data is lighter-tailed than normal", "Platykurtic"], ["Inverted S", "Data is heavier-tailed than normal", "Leptokurtic / fat tails"], ["Curve upward at ends", "Right skew", ""], ["Curve downward at ends", "Left skew", ""]] },

    </div>
    <div class="unit-grid">
      ${units.map(u => `
        <div class="unit-card" onclick="loadTopic(${u.topics[0]})">
          <div class="unit-label" style="color:${u.color}">${u.name}</div>
          <div class="unit-name">Topics ${u.topics[0]}–${u.topics[u.topics.length - 1]}</div>
          <div class="unit-count">${u.topics.length} topics · ${u.topics.reduce((a, id) => { const t = topics.find(t => t.id === id); return a + (t ? t.questions.length : 0); }, 0)} questions</div>
        </div>
      `).join('')}
    </div>
  `;
    }

    function loadTopic(id) {
        currentTopic = id;
        const t = topics.find(x => x.id === id);
        document.getElementById('home-screen').style.display = 'none';
        const ca = document.getElementById('content-area');
        ca.style.display = 'block';

        let html = `
    <span class="section-tag">${t.tag}</span>
    <h2 class="topic-heading">Topic ${t.id}: ${t.title}</h2>
    <p class="topic-subtitle">${t.subtitle}</p>
  `;

        t.content.forEach(c => {
            if (c.type === 'text') {
                html += `<div class="content-block"><h3>${c.heading}</h3><p>${c.body}</p></div>`;
            } else if (c.type === 'table') {
                html += `<div class="content-block"><h3>${c.heading}</h3><table class="key-table">`;
                if (c.rows[0].length === 3) html += '<tr><th>Term</th><th>Meaning</th><th>Example</th></tr>';
                c.rows.forEach(r => { html += `<tr>${r.map(cell => `<td>${cell}</td>`).join('')}</tr>`; });
                html += '</table></div>';
            } else if (c.type === 'formula') {
                html += `<div class="content-block"><h3>Key formulas</h3><div class="formula-box"><pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:13px;text-align:left">${c.text}</pre></div></div>`;
            } else if (c.type === 'example') {
                html += `<div class="content-block"><h3>Worked example</h3><div class="example-box"><pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:12px">${c.text}</pre></div></div>`;
            }
        });

        html += `<div class="content-block"><h3>Practice Questions</h3>`;
        t.questions.forEach((q, i) => {
            const qid = `q_${id}_${i}`;
            html += `
      <div class="q-block">
        <span class="q-label">${q.difficulty}</span>
        <p class="q-text">${q.q}</p>
        <button class="btn-reveal" onclick="toggleAnswer('${qid}')">Show Solution</button>
        <div class="q-answer" id="${qid}"><strong>Solution:</strong><br>${q.a}</div>
      </div>
    `;
        });
        html += '</div>';

        html += `<div class="nav-footer">`;
        if (id > 1) html += `<button class="btn-nav" onclick="loadTopic(${id - 1})">← Previous</button>`;

        const isDone = completed.has(id);
        html += `<button class="btn-done ${isDone ? 'marked' : ''}" id="done-btn" onclick="markDone(${id})">${isDone ? '✓ Completed' : 'Mark Complete'}</button>`;

        if (id < 30) html += `<button class="btn-nav primary" onclick="loadTopic(${id + 1})">Next Topic →</button>`;
        html += `</div>`;

        ca.innerHTML = html;
        ca.scrollTop = 0;
        renderSidebar();
    }

    function toggleAnswer(id) {
        const el = document.getElementById(id);
        const btn = el.previousElementSibling;
        el.classList.toggle('show');
        btn.textContent = el.classList.contains('show') ? 'Hide Solution' : 'Show Solution';
    }

    function markDone(id) {
        if (completed.has(id)) { completed.delete(id); }
        else { completed.add(id); }
        const btn = document.getElementById('done-btn');
        if (btn) {
            btn.textContent = completed.has(id) ? '✓ Completed' : 'Mark Complete';
            btn.classList.toggle('marked', completed.has(id));
        }
        renderSidebar();
    }

    init();
</script>
